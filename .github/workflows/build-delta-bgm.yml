name: Build Delta BGM IPA

on:
  push:
    branches:
      - feature/ds-bgm-1x
      - thermal/ios13-ds-render-skip
      - experimental/ios-arm64-jit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout experimental native ARM64 JIT DS core
        run: |
          git -C Cores/MelonDSDeltaCore fetch origin refs/heads/experimental/ios-arm64-jit
          git -C Cores/MelonDSDeltaCore checkout --detach FETCH_HEAD

      - name: Checkout thread-safe DS 3D renderer
        run: |
          git -C Cores/MelonDSDeltaCore/melonDS fetch origin refs/heads/thermal/skip-3d-thread-safe
          git -C Cores/MelonDSDeltaCore/melonDS checkout --detach FETCH_HEAD

      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod install

      - name: Build unsigned app archive
        run: |
          xcodebuild archive \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DeltaBGM.xcarchive" \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-register -O3' \
            LLVM_LTO=YES_THIN \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/DeltaBGM.xcarchive/Products/Applications/Delta.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -r "$GITHUB_WORKSPACE/Delta-BGM-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delta-BGM-unsigned-IPA
          path: Delta-BGM-unsigned.ipa
          if-no-files-found: error

# Build with thread-safe DS rendering skips, optimized C++ release code, and ThinLTO.
